# Allow to automactically discover AWS EC2 instances with specific filters
# https://docs.ansible.com/projects/ansible/latest/collections/amazon/aws/aws_ec2_inventory.html
plugin: amazon.aws.aws_ec2

# Filters: Only pull instances that are running and have your specific tag
filters:
  # those filters are AND filters! All must be true so that it passes
  instance-state-name: running
  tag:Project: 
    - aitt
  tag:Env:
    - "{{ lookup('env', 'ENV') }}"

# Tell Ansible to use the Public IP for the connection
compose:
  ansible_host: public_ip_address

groups:
  # This says: "If a host is found, put it in the 'aitt-instance' group"
  aitt_instance: true

use_cache: yes # set to no while debugging